<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    
    <main id="form-container">
        <form action="">
            <h1>Create Account</h1>
            <label for="username"> User name:</label>
            <input type="text" id="username" placeholder="Username" required>
            

            <label for="email"> Email:</label>
            <input type="email" id="email" placeholder="Email" required>
            

            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Password" pattern="^(.{0,7}|[^0-9]*|[^A-Z]*|[^a-z]*|[a-zA-Z0-9]*)$" required>
            

            <label for="confirm-password"> Confirm Password:</label>
            <input type="password" id="confirm-password" placeholder="Confirm Password" pattern="^(.{0,7}|[^0-9]*|[^A-Z]*|[^a-z]*|[a-zA-Z0-9]*)$" required>
            
            <p id="message"></p>

            <input type="button" value="Submit" onclick="passwordChecker()">
        </form>
    </main>

    <script src="main.js"></script>
</body>
</html>
